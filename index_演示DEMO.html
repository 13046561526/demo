<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>泛微 E10 · 演示DEMO应用 Demo</title>
<meta name="description" content="泛微 E10 低代码平台「演示DEMO」应用：在线可点击 Demo。包含表单、台账、工作流审批、报表等交互。纯静态单文件，可直接部署到 GitHub Pages。" />
<style>
  :root{
    --primary:#2b6de8; --primary-dark:#1d55c4; --primary-light:#eaf1ff;
    --bg:#f3f5fa; --panel:#fff; --line:#e6e9f0; --text:#26324b; --muted:#8a93a6;
    --green:#1fb47a; --orange:#f59d2f; --red:#e5533c; --purple:#8a5bd6; --cyan:#1fa2c4;
    --shadow:0 2px 6px rgba(30,50,90,.08); --shadow-lg:0 12px 32px rgba(30,50,90,.16);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  .app{display:flex;height:100vh;overflow:hidden;}

  /* ---------- 左侧菜单 ---------- */
  .sidenav{width:232px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line);}
  .brand .logo{width:34px;height:34px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;box-shadow:0 4px 10px rgba(43,109,232,.4);}
  .brand .t1{font-weight:700;font-size:15px;line-height:1.2;}
  .brand .t2{font-size:11px;color:var(--muted);}
  .menu{padding:10px 12px;overflow-y:auto;flex:1;}
  .menu .grp{font-size:11px;color:var(--muted);padding:12px 8px 6px;letter-spacing:.5px;}
  .menu a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer;margin-bottom:2px;transition:.15s;}
  .menu a .ico{width:20px;text-align:center;opacity:.85;font-size:16px;}
  .menu a:hover{background:#f4f6fb;}
  .menu a.active{background:var(--primary-light);color:var(--primary);font-weight:600;}
  .menu a.active .ico{opacity:1;}
  .badge{background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:1px 6px;margin-left:auto;}

  /* ---------- 主区域 ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px;flex-shrink:0;}
  .topbar .crumb{color:var(--muted);display:flex;align-items:center;gap:6px;font-size:13px;}
  .topbar .crumb b{color:var(--text);font-weight:600;}
  .topbar .spacer{flex:1;}
  .topbar .user{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .content{flex:1;overflow:auto;padding:22px;}

  /* ---------- 通用组件 ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
  .card + .card{margin-top:18px;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .stat .lbl{color:var(--muted);font-size:13px;}
  .stat .num{font-size:28px;font-weight:700;margin:6px 0 4px;}
  .stat .sub{font-size:12px;color:var(--muted);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  .btn:hover{border-color:var(--primary);color:var(--primary);}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.sm{padding:5px 12px;font-size:12px;border-radius:6px;}

  /* ---------- 表单表格 ---------- */
  table.grid{width:100%;border-collapse:collapse;}
  table.grid th{background:#f7f9fd;text-align:left;padding:10px 12px;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;}
  table.grid td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;}
  table.grid tbody tr{cursor:pointer;transition:.12s;}
  table.grid tbody tr:hover{background:#f5f8ff;}
  .tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;line-height:18px;}
  .tag.green{background:#e5f8f0;color:#0d9160;}
  .tag.orange{background:#fef1e0;color:#c47b10;}
  .tag.red{background:#fde8e5;color:#c03420;}
  .tag.gray{background:#eef1f6;color:#6b7488;}
  .tag.purple{background:#efe8fb;color:#6d43c0;}
  .tag.blue{background:var(--primary-light);color:var(--primary);}
  .money{font-weight:600;}

  /* ---------- 流程步骤 ---------- */
  .steps{display:flex;align-items:flex-start;padding:6px 0;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;min-width:0;}
  .step::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:#e6e9f0;z-index:0;}
  .step:first-child::before{display:none;}
  .step .circ{width:30px;height:30px;border-radius:50%;background:#e6e9f0;color:#98a1b5;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;z-index:1;border:2px solid #fff;}
  .step.on .circ{background:var(--primary);color:#fff;box-shadow:0 0 0 5px rgba(43,109,232,.15);}
  .step.done .circ{background:var(--green);color:#fff;}
  .step.done::before{background:var(--green);}
  .step.on::before{background:var(--primary);}
  .step .name{font-size:12px;margin-top:8px;color:var(--muted);}
  .step.on .name{color:var(--text);font-weight:600;}
  .step .who{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ---------- 时间线 ---------- */
  .timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:18px;}
  .tl-item{position:relative;padding-bottom:16px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:"";position:absolute;left:-24px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-light);}
  .tl-item .tl-head{font-size:13px;font-weight:600;}
  .tl-item .tl-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .tl-item .tl-note{font-size:12px;color:var(--text);margin-top:4px;background:var(--primary-light);padding:6px 10px;border-radius:6px;}

  /* ---------- 小 chart ---------- */
  .bars{display:flex;align-items:flex-end;gap:22px;height:220px;padding:10px 6px 0;}
  .bars .bb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bars .bb .val{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .bars .bb i{display:block;width:44px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#4d84ef,#2b6de8);margin-bottom:0;}
  .bars .bb .bx{font-size:12px;color:var(--text);margin-top:8px;text-align:center;}

  /* ---------- 模态 ---------- */
  .mask{position:fixed;inset:0;background:rgba(20,30,55,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:12px;width:640px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg);}
  .modal.wide{width:860px;}
  .modal .m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2;}
  .modal .m-head h4{margin:0;font-size:16px;}
  .modal .m-body{padding:20px 22px;}
  .modal .m-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff;}
  .x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;}
  .x:hover{color:var(--text);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12px;color:var(--muted);}
  .field label b{color:var(--red);}
  .field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(43,109,232,.12);}
  .field textarea{resize:vertical;min-height:70px;}

  .sub-table{margin-top:6px;}
  .sub-table table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .sub-table th{background:#f7f9fd;padding:8px 10px;font-size:12px;color:var(--muted);text-align:left;}
  .sub-table td{padding:6px 10px;border-top:1px solid var(--line);}
  .sub-table input{border:none;background:transparent;outline:none;width:100%;font-size:13px;font-family:inherit;color:var(--text);}
  .sub-table input:focus{border-bottom:1px solid var(--primary);}
  .row-del{color:var(--red);cursor:pointer;font-size:15px;text-align:center;}

  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#26324b;color:#fff;padding:12px 22px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;z-index:99;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .empty{padding:40px;text-align:center;color:var(--muted);}

  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px;}
  .kpi{text-align:center;padding:14px;border-top:2px solid var(--line);}
  .kpi .n{font-size:22px;font-weight:700;}
  @media(max-width:960px){.grid-cards{grid-template-columns:repeat(2,1fr);}.sidenav{width:200px;}}
  @media(max-width:720px){.sidenav{display:none;}}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边菜单 -->
  <nav class="sidenav">
    <div class="brand">
      <div class="logo">E</div>
      <div><div class="t1">演示DEMO</div><div class="t2">泛微 E10 演示应用</div></div>
    </div>
    <div class="menu" id="menu">
      <div class="grp">应用</div>
      <a data-view="dashboard" class="active"><span class="ico">🏠</span> 工作台</a>
      <a data-view="mylist"><span class="ico">📋</span> 我的申请</a>
      <a data-view="todo"><span class="ico">✅</span> 待办审批 <span class="badge" id="todoBadge">0</span></a>
      <a data-view="report"><span class="ico">📊</span> 费用报表</a>
      <div class="grp">流程</div>
      <a data-view="flow"><span class="ico">🔄</span> 流程设置</a>
      <a data-view="settings"><span class="ico">⚙️</span> 应用设置</a>
    </div>
  </nav>

  <!-- 主区域 -->
  <div class="main">
    <div class="topbar">
      <div class="crumb">泛微 e-cology <span>›</span> <b id="crumb">工作台</b></div>
      <div class="spacer"></div>
      <span class="btn sm" onclick="openNew()">＋ 新建申请</span>
      <div class="user"><div class="avatar">王</div> 王小明</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- 新建/编辑 表单模态 -->
<div class="mask" id="formMask">
  <div class="modal">
    <div class="m-head"><h4 id="formTitle">新建演示DEMO单</h4><button class="x" onclick="closeForm()">✕</button></div>
    <div class="m-body">
      <div class="form-grid">
        <div class="field"><label>申请人 <b>*</b></label><input id="f_applicant" value="王小明" /></div>
        <div class="field"><label>所属部门 <b>*</b></label>
          <select id="f_dept"><option>研发中心</option><option>市场部</option><option>财务部</option><option>行政管理部</option><option>销售一部</option></select>
        </div>
        <div class="field"><label>报销类型 <b>*</b></label>
          <select id="f_type"><option>差旅费</option><option>交通费</option><option>业务招待费</option><option>办公用品</option><option>通讯费</option></select>
        </div>
        <div class="field"><label>报销金额 (¥) <b>*</b></label><input id="f_amount" type="number" placeholder="0.00" oninput="calcTotal()" /></div>
        <div class="field full"><label>费用事由 <b>*</b></label><textarea id="f_reason" placeholder="请填写费用发生的详细事由..."></textarea></div>
        <div class="field full"><label>费用明细（子表）</label>
          <div class="sub-table">
            <table id="subTable">
              <thead><tr><th style="width:26%">费用日期</th><th style="width:34%">费用项目</th><th>金额(¥)</th><th style="width:28px"></th></tr></thead>
              <tbody id="subBody"></tbody>
              <tfoot><tr><td colspan="4"><span class="btn sm" onclick="addSubRow()">＋ 添加一行</span></td></tr></tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="m-foot"><button class="btn" onclick="closeForm()">取消</button><button class="btn primary" onclick="submitForm()">保存并提交</button></div>
  </div>
</div>

<!-- 详情模态 -->
<div class="mask" id="detailMask">
  <div class="modal wide">
    <div class="m-head"><h4>申请单详情</h4><button class="x" onclick="closeDetail()">✕</button></div>
    <div class="m-body" id="detailBody"></div>
    <div class="m-foot" id="detailFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 数据模拟 ============ */
const FLOW = [
  {name:"发起申请", who:"申请人"},
  {name:"部门经理审批", who:"部门经理"},
  {name:"财务复核", who:"财务部"},
  {name:"归档完成", who:"自动"},
];
function now(){const d=new Date();const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
const seedTime = Date.now() - 3600e3*6;

let db = [
  {id:"BX2026001", applicant:"王小明", dept:"研发中心", type:"差旅费", amount:4680, reason:"上海客户现场交付支持，出差 3 天，含高铁、住宿及市内交通。", items:[{d:"2026-05-12",n:"高铁往返",a:1260},{d:"2026-05-13",n:"住宿",a:980},{d:"2026-05-12",n:"市内交通",a:420}], step:1, status:"审批中", ctime:seedTime, author:"部门经理", note:"行程与附件齐全，同意。", history:[{t:"2026-05-12 09:12",w:"王小明",a:"提交申请"},{t:"2026-05-12 10:03",w:"刘经理",a:"部门经理审批 · 同意"}]},
  {id:"BX2026002", applicant:"李梅", dept:"市场部", type:"业务招待费", amount:1860, reason:"重点客户拜访商务餐叙。", items:[{d:"2026-05-11",n:"餐饮",a:1860}], step:2, status:"审批中", ctime:seedTime+1, author:"财务部", note:"发票已验真，同意归档。", history:[{t:"2026-05-11 15:40",w:"李梅",a:"提交申请"},{t:"2026-05-12 09:20",w:"赵总",a:"部门经理审批 · 同意"},{t:"2026-05-12 11:02",w:"财务-陈",a:"财务复核 · 同意"}]},
  {id:"BX2026003", applicant:"张伟", dept:"销售一部", type:"交通费", amount:920, reason:"月度客户回访打车。", items:[{d:"2026-05-09",n:"打车",a:920}], step:3, status:"已归档", ctime:seedTime+2, author:"系统", note:"流程已结束并归档至台账。", history:[{t:"2026-05-09 08:30",w:"张伟",a:"提交申请"},{t:"2026-05-09 10:12",w:"孙经理",a:"部门经理审批 · 同意"},{t:"2026-05-10 09:00",w:"财务-陈",a:"财务复核 · 同意"},{t:"2026-05-10 09:05",w:"系统",a:"自动归档"}]},
  {id:"BX2026004", applicant:"周婷", dept:"行政管理部", type:"办公用品", amount:2350, reason:"采购打印机硒鼓及墨盒。", items:[{d:"2026-05-08",n:"耗材采购",a:2350}], step:1, status:"已驳回", ctime:seedTime+3, author:"部门经理", note:"缺少下单明细，请补充后重新提交。", history:[{t:"2026-05-08 14:22",w:"周婷",a:"提交申请"},{t:"2026-05-08 15:00",w:"孙经理",a:"部门经理审批 · 退回"}]},
  {id:"BX2026005", applicant:"王小明", dept:"研发中心", type:"通讯费", amount:300, reason:"本月办公手机话费报销。", items:[{d:"2026-05-06",n:"话费",a:300}], step:0, status:"草稿", ctime:seedTime+4, author:"", note:"", history:[{t:"2026-05-06 09:00",w:"王小明",a:"保存为草稿"}]},
];
let seq = 6;
const statusTag = s=>{
  if(s==="草稿")return '<span class="tag gray">草稿</span>';
  if(s==="审批中")return '<span class="tag orange">审批中</span>';
  if(s==="已归档")return '<span class="tag green">已归档</span>';
  if(s==="已驳回")return '<span class="tag red">已驳回</span>';
  return s;
};
const money = n=>Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});

/* ============ 视图渲染 ============ */
const content = document.getElementById("content");
const crumb = document.getElementById("crumb");
let currentView = "dashboard";

function setNav(v){
  document.querySelectorAll("#menu a").forEach(a=>a.classList.toggle("active",a.dataset.view===v));
  const names={dashboard:"工作台",mylist:"我的申请",todo:"待办审批",report:"费用报表",flow:"流程设置",settings:"应用设置"};
  crumb.textContent=names[v]||v;
  currentView=v;
  render();
}
function myList(){return db.filter(r=>r.applicant==="王小明");}
function todoList(){return db.filter(r=>r.status==="审批中" && r.step<3);}

function render(){
  content.innerHTML = viewHtml[currentView]();
  if(currentView==="todo"){ content.querySelectorAll("[data-approve]").forEach(b=>b.onclick=e=>approve(e.target.dataset.id,true)); content.querySelectorAll("[data-reject]").forEach(b=>b.onclick=e=>approve(e.target.dataset.id,false)); }
  content.querySelectorAll("[data-open]").forEach(r=>r.onclick=e=>{const id=e.currentTarget.dataset.open;openDetail(id);e.stopPropagation();});
  var b=document.getElementById("todoBadge"); if(b)b.textContent=todoList().length;
}
function myCardTitle(){return currentView==="mylist"?"王小明 · 我的申请":"待办审批";}

let viewHtml = {
  dashboard(){
    const todo=todoList().length, total=db.length, done=db.filter(r=>r.status==="已归档").length, amt=db.filter(r=>r.status==="已归档").reduce((s,r)=>s+r.amount,0);
    const recent=db.slice().sort((a,b)=>b.ctime-a.ctime).slice(0,5);
    return `
    <div class="grid-cards">
      <div class="stat"><div class="lbl">待我审批</div><div class="num" style="color:var(--orange)">${todo}</div><div class="sub">点击左侧进入处理</div></div>
      <div class="stat"><div class="lbl">我的申请</div><div class="num" style="color:var(--primary)">${myList().length}</div><div class="sub">含草稿与流程中</div></div>
      <div class="stat"><div class="lbl">已归档</div><div class="num" style="color:var(--green)">${done}</div><div class="sub">流程全部完成</div></div>
      <div class="stat"><div class="lbl">累计报销(归档)</div><div class="num" style="color:var(--purple)">¥${money(amt)}</div><div class="sub">本周期统计</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>📋 最近申请</h3>
      <table class="grid"><thead><tr><th>单号</th><th>申请人</th><th>部门</th><th>类型</th><th>金额</th><th>状态</th></tr></thead>
      <tbody>${recent.map(r=>`<tr data-open="${r.id}"><td>${r.id}</td><td>${r.applicant}</td><td>${r.dept}</td><td>${r.type}</td><td class="money">¥${money(r.amount)}</td><td>${statusTag(r.status)}</td></tr>`).join("")}</tbody></table>
      ${recent.length?"":`<div class="empty">暂无数据，点击右上角「新建申请」开始。</div>`}
    </div>
    <div class="card">
      <h3>🛠 快速上手</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn primary" onclick="openNew()">＋ 新建演示DEMO单</button>
        <button class="btn" onclick="go('todo')">处理待办 (${todo})</button>
        <button class="btn" onclick="go('report')">查看费用报表</button>
        <button class="btn" onclick="go('flow')">查看流程配置</button>
      </div>
    </div>`;
  },
  mylist(){
    const list=myList();
    return /*html*/`
    <div class="card">
      <h3>📋 王小明 · 我的申请</h3>
      <div style="margin-bottom:14px"><button class="btn primary" onclick="openNew()">＋ 新建申请</button></div>
      <table class="grid"><thead><tr><th>单号</th><th>类型</th><th>金额</th><th>申请时间</th><th>当前节点</th><th>状态</th></tr></thead>
      <tbody>${list.map(r=>`<tr data-open="${r.id}"><td>${r.id}</td><td>${r.type}</td><td class="money">¥${money(r.amount)}</td><td>${r.ctime}</td><td>${FLOW[r.step].name}</td><td>${statusTag(r.status)}</td></tr>`).join("")}
      </tbody></table>
      ${list.length?"":`<div class="empty">还没有申请记录。</div>`}
    </div>`;
  },
  todo(){
    const list=todoList();
    return `
    <div class="card">
      <h3>✅ 待办审批 <span class="tag orange">${list.length}</span></h3>
      ${list.map(r=>`
        <div style="border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
            <div>
              <div style="font-weight:600">${r.applicant} · ${r.dept} <span class="money" style="color:var(--primary)">¥${money(r.amount)}</span></div>
              <div style="color:var(--muted);font-size:12px;margin-top:4px">${r.id} | ${r.type} | ${r.reason}</div>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn sm primary" data-approve="${r.id}">同意</button>
              <button class="btn sm" data-reject="${r.id}">驳回</button>
              <button class="btn sm" onclick="openDetail('${r.id}')">详情</button>
            </div>
          </div>
        </div>`).join("")}
      ${list.length?"":`<div class="empty">🎉 没有待办的审批事项。</div>`}
    </div>`;
  },
  report(){
    const rows=db.filter(r=>r.status!=="草稿");
    const byType={}; rows.forEach(r=>byType[r.type]=(byType[r.type]||0)+r.amount);
    const types=["差旅费","交通费","业务招待费","办公用品","通讯费"];
    const max=Math.max(1,...types.map(t=>byType[t]||0));
    const total=rows.reduce((s,r)=>s+r.amount,0); const avg=rows.length?Math.round(total/rows.length):0;
    return `
    <div class="grid-cards">
      <div class="stat"><div class="lbl">报销总额</div><div class="num" style="color:var(--primary)">¥${money(total)}</div><div class="sub">全部有效单据</div></div>
      <div class="stat"><div class="lbl">平均每单</div><div class="num" style="color:var(--purple)">¥${money(avg)}</div><div class="sub">按单据数</div></div>
      <div class="stat"><div class="lbl">单据数</div><div class="num" style="color:var(--green)">${rows.length}</div><div class="sub">不含草稿</div></div>
      <div class="stat"><div class="lbl">已归档笔数</div><div class="num" style="color:var(--orange)">${rows.filter(r=>r.status==="已归档").length}</div><div class="sub">完成率 ${rows.length?Math.round(rows.filter(r=>r.status==="已归档").length/rows.length*100):0}%</div></div>
    </div>
    <div class="card">
      <h3>📊 按报销类型汇总</h3>
      <div class="bars">${types.map(t=>{const v=byType[t]||0;const h=Math.round(v/max*100);return `<div class="bb"><span class="val">¥${money(v)}</span><i style="height:${Math.max(4,h)}%"></i><span class="bx">${t}</span></div>`;}).join("")}</div>
    </div>`;
  },
  flow(){
    return `
    <div class="card">
      <h3>🔄 审批流程配置</h3>
      <div class="steps">${FLOW.map((s,i)=>`<div class="step ${i===0?'done':''}"><div class="circ">${i+1}</div><div class="name">${s.name}</div><div class="who">处理人：${s.who}</div></div>`).join("")}</div>
      <div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:10px">
        <div><span class="dot" style="background:var(--primary)"></span>发起节点</div>
        <div><span class="dot" style="background:var(--green)"></span>审批节点（会签：部门经理 + 财务复核）</div>
        <div><span class="dot" style="background:var(--line)"></span>归档/结束</div>
      </div>
      <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--muted)">
        本 Demo 演示真实 E10 工作流的「表单发起 → 部门经理审批 → 财务复核 → 自动归档」主干逻辑。可在「待办审批」中实际点击「同意/驳回」观察节点推进与时间线变化。
      </div>
    </div>`;
  },
  settings(){
    return `
    <div class="card">
      <h3>⚙️ 应用设置</h3>
      <div class="form-grid" style="margin-top:6px">
        <div class="field"><label>应用名称</label><input value="演示DEMO管理" disabled/></div>
        <div class="field"><label>应用编码</label><input value="e10_expense" disabled/></div>
        <div class="field"><label>使用范围</label><input value="全体成员（演示）" disabled/></div>
        <div class="field"><label>表单版本</label><input value="v1.0" disabled/></div>
        <div class="field full"><label>演示说明</label><textarea disabled rows="4">这是基于泛微 E10 低代码平台搭建的「演示DEMO」应用在线演示。左侧菜单可在本 Demo 内交互操作，「新建申请」可提交一条全新单据并进入审批流。该页面为纯静态单文件，可直接部署到 GitHub Pages。</textarea></div>
      </div>
    </div>`;
  }
};
function go(v){setNav(v);}

/* ============ 表单逻辑 ============ */
const formMask=document.getElementById("formMask");
function addSubRow(d="",n="",a=""){const tb=document.getElementById("subBody");const tr=document.createElement("tr");tr.innerHTML=`<td><input type="date" value="${d}"/></td><td><input type="text" value="${n}" placeholder="项目名称"/></td><td><input type="number" value="${a}" placeholder="0.00"/></td><td class="row-del" title="删除">✕</td>`;tr.querySelector(".row-del").onclick=()=>tr.remove();tr.querySelectorAll("input").forEach(i=>i.onchange=calcTotal);tb.appendChild(tr);}
function openNew(){formMask.classList.add("show");document.getElementById("formTitle").textContent="新建演示DEMO单";document.getElementById("f_applicant").value="王小明";document.getElementById("f_amount").value="";document.getElementById("f_reason").value="";document.getElementById("f_dept").value="研发中心";document.getElementById("f_type").value="差旅费";document.getElementById("subBody").innerHTML="";addSubRow();}
function closeForm(){formMask.classList.remove("show");}
function getSubRows(){return [...document.querySelectorAll("#subBody tr")].map(tr=>{const i=tr.querySelectorAll("input");return {d:i[0].value,n:i[1].value,a:parseFloat(i[2].value)||0};}).filter(r=>r.n||r.a);}
function calcTotal(){const subs=getSubRows();const manual=parseFloat(document.getElementById("f_amount").value)||0;let sum=subs.reduce((s,r)=>s+r.a,0);if(subs.length)document.getElementById("f_amount").value=sum.toFixed(2);}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function submitForm(){
  const applicant=document.getElementById("f_applicant").value.trim();
  const amount=parseFloat(document.getElementById("f_amount").value)||0;
  const reason=document.getElementById("f_reason").value.trim();
  const subs=getSubRows();
  if(!applicant||!amount||!reason){toast("请填写完整必填项（申请人/金额/事由）");return;}
  const id="BX2026"+String(seq).padStart(3,"0"); seq++;
  const rec={id,applicant,dept:document.getElementById("f_dept").value,type:document.getElementById("f_type").value,amount,reason,items:subs.length?subs:[{d:now().slice(0,10),n:"其他",a:amount}],step:1,status:"审批中",ctime:now(),author:"部门经理",note:"",history:[{t:now(),w:applicant,a:"提交申请"}]};
  db.push(rec);
  closeForm(); toast("已提交，进入「部门经理审批」节点");
  setNav(currentView); 
  openDetail(id);
}
function approve(id,ok){
  const r=db.find(x=>x.id===id); if(!r)return;
  const t=now(); const who = r.step===1 ? "刘经理" : "财务-陈";
  if(ok){
    r.history.push({t,w:who,a:`${FLOW[r.step].name} · 同意`});
    r.step++;
    if(r.step>=3){r.status="已归档";r.step=3;r.history.push({t:now(),w:"系统",a:"自动归档"});toast("已同意，流程自动归档");}
    else { r.status="审批中"; r.step=Math.min(2,r.step); toast("已同意，进入下一节点："+FLOW[r.step].name); }
  } else {
    r.status="已驳回"; r.history.push({t,w:who,a:`${FLOW[r.step].name} · 驳回`}); toast("已驳回该单据");
  }
  render();
}

/* ============ 详情 ============ */
const detailMask=document.getElementById("detailMask");
function openDetail(id){
  const r=db.find(x=>x.id===id); if(!r)return;
  const stepNow=r.status==="已归档"?3:r.status==="已驳回"?-1:r.step;
  const stepsHtml=`<div class="steps">${FLOW.map((s,i)=>{
    let cls=""; if(r.status==="已归档"&&i<=3)cls="done"; else if(r.status==="审批中"){if(i<r.step)cls="done";else if(i===r.step)cls="on";} else if(r.status==="已驳回"){if(i<r.step)cls="done"; else if(i===r.step)cls="on";} else if(r.status==="草稿"){if(i===0)cls="on";}
    return `<div class="step ${cls}"><div class="circ">${i+1}</div><div class="name">${s.name}</div><div class="who">${r.status==="已归档"?(i===3?"自动":"已处理"):"处理人："+s.who}</div></div>`;}).join("")}</div>`;
  const items= r.items.map(it=>`<tr><td>${it.d}</td><td>${it.n}</td><td>¥${money(it.a)}</td></tr>`).join("")||`<tr><td colspan="3" style="color:var(--muted)">未填写子表</td></tr>`;
  const tl=r.history.slice().reverse().map(h=>`<div class="tl-item"><div class="tl-head">${h.a}</div><div class="tl-meta">${h.w} · ${h.t}</div>${h.a.includes("驳回")?`<div class="tl-note">${r.note||"请补充信息后重新提交。"}</div>`:""}</div>`).join("");
  document.getElementById("detailBody").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:8px">
      <div><div style="font-weight:700;font-size:17px">${r.id} · ${r.type}</div><div style="color:var(--muted);font-size:12px;margin-top:4px">申请人：${r.applicant} ｜ 部门：${r.dept} ｜ 申请时间：${r.ctime}</div></div>
      <div style="text-align:right"><div style="font-size:24px;font-weight:700;color:var(--primary)">¥${money(r.amount)}</div>${statusTag(r.status)}</div>
    </div>
    <div class="card" style="padding:16px 18px">${stepsHtml}</div>
    <div class="card" style="padding:16px 18px">
      <h3 style="margin-top:0">📄 明细</h3>
      <table class="grid"><thead><tr><th>费用日期</th><th>费用项目</th><th>金额</th></tr></thead><tbody>${items}</tbody></table>
    </div>
    <div class="card" style="padding:16px 18px">
      <h3 style="margin-top:0">🧾 事由说明</h3><div>${r.reason}</div>
    </div>
    <div class="card" style="padding:16px 18px">
      <h3 style="margin-top:0">🕒 流转记录</h3><div class="timeline">${tl||'<div class="empty">暂无流转记录</div>'}</div>
    </div>`;
  let foot="";
  if(r.status==="草稿") foot=`<button class="btn" onclick="submitDraft('${r.id}')">提交审批</button>`;
  if(r.status==="审批中") foot=`<button class="btn primary" onclick="approve('${r.id}',true)">同意（模拟审批）</button> <button class="btn" onclick="approve('${r.id}',false)">驳回</button>`;
  if(r.status==="已驳回"||r.status==="已归档") foot=`<button class="btn" onclick="printDetail('${r.id}')">打印/导出</button>`;
  if(r.status==="草稿") foot=`<button class="btn" onclick="printDetail('${r.id}')">打印/导出</button>`;
  document.getElementById("detailFoot").innerHTML=foot;
  detailMask.classList.add("show");
}
function submitDraft(id){const r=db.find(x=>x.id===id);if(!r)return;r.status="审批中";r.step=1;r.history.push({t:now(),w:r.applicant,a:"提交申请"});toast("已提交审批");render();openDetail(id);}
function printDetail(id){toast("演示环境：该操作会生成 PDF 预览（正式版对接打印模板）。");}
function closeDetail(){detailMask.classList.remove("show");}
document.addEventListener("click",e=>{if(e.target.classList.contains("mask"))e.target.classList.remove("show");});

setNav("dashboard");
addSubRow("2026-05-12","高铁往返","1260");
</script>
</body>
</html>
