  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}

  .tag.orange{background:#fef1e0;color:#c47b10;}
  .tag.red{background:#fde8e5;color:#c03420;}
  .tag.gray{background:#eef1f6;color:#6b7488;}
  .tag.purple{background:#efe8fb;color:#6d43c0;}

  .step:first-child::before{display:none;}
  .step .circ{width:30px;height:30px;border-radius:50%;background:#e6e9f0;color:#98a1b5;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;z-index:1;border:2px solid #fff;}

  .step.done .circ{background:var(--green);color:#fff;}

  .timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:18px;}

  .legend-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:14px;}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;}
  table.mini td{padding:6px 6px;border-bottom:1px solid var(--line);}
  table.mini td:first-child{color:var(--muted);}
  @media(max-width:960px){.grid-cards{grid-template-columns:repeat(2,1fr);}.gauge-wrap{grid-template-columns:repeat(2,1fr);}.sidenav{width:204px;}}
  @media(max-width:720px){.sidenav{display:none;}.split{grid-template-columns:1fr;}}
</style>

/* ============================================================
  交互函数
  ============================================================ */
function go(v){setNav(v);}
function stepsHtml(steps,cur,status,extra){
  return `<div class="steps">${steps.map((s,i)=>{
    let cls="";
    if(status==="已归档")cls="done";
    else if(status==="已驳回"){if(i<cur)cls="done";else if(i===cur)cls="on";}
    else if(status==="审批中"){if(i<cur)cls="done";else if(i===cur)cls="on";}
    else if(status==="草稿"){if(i===0)cls="on";}
    return `<div class="step ${cls}"><div class="circ">${i+1}</div><div class="name">${s}</div>${i===cur&&status==="审批中"?`<div class="who">当前节点</div>`:""}</div>`;}).join("")}</div>`;
}

/* ---------- 审批 ---------- */
function approve(id,ok){
  const t=todos.find(x=>x.id===id); if(!t)return;
  const tnow=now();
  if(ok){
    t.history=t.history||[];
    t.history.push({t:tnow,w:"王小明",a:`${t.steps[t.step]} · 同意`});
    t.step++;
    if(t.step>=t.steps.length-1){t.step=t.steps.length-1;t.status="已归档";toast("已通过，进入用印归档阶段");}
    else if(t.step>=t.steps.length){t.step=t.steps.length-1;t.status="已归档";toast("已通过，流程归档");}
    else {t.status="审批中";toast("已同意，进入「"+t.steps[t.step]+"」");}
  } else {
    t.status="已驳回";toast("已驳回该事项");
  }
  render(); openDetail(id);
}
function submitDraft(id){const t=todos.find(x=>x.id===id);if(!t)return;t.status="审批中";t.step=1;toast("已提交审批");render();openDetail(id);}

/* ---------- 风险审核 ---------- */
function auditRisk(id,ok){
  const r=riskPool.find(x=>x.id===id); if(!r)return;
  if(ok){r.status="整改中";toast("已核实，进入 OA 风险整改闭环");}
  else {r.status="已销号";toast("已驳回，记为误报");}
  render(); openRiskDetail(id);
}

/* ---------- 问题闭环推进 ---------- */
const ISSUE_FLOW=["待上报","待核实","已分派","整改中","待复核","已关闭"];
function advanceIssue(id){
  const i=issues.find(x=>x.id===id); if(!i)return;
  const cur=ISSUE_FLOW.indexOf(i.status);
  const next=ISSUE_FLOW[Math.min(cur+1,ISSUE_FLOW.length-1)];
  i.status=next;
  if(next==="整改中")i.progress="已完成 60%";
  if(next==="已关闭")i.progress="已完成 100%";
  toast("问题状态 → "+next);
  render();
}

/* ---------- 详情 ---------- */
const detailMask=document.getElementById("detailMask");
function openDetail(id){
  // 优先匹配待办
  const t=todos.find(x=>x.id===id);
  if(t){
    document.getElementById("detailTitle").textContent=t.flow;
    document.getElementById("detailBody").innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px">
        <div><div style="font-weight:700;font-size:16px">${t.title}</div><div style="color:var(--muted);font-size:12px;margin-top:4px">单号 ${t.id} | 提交：${t.submit} | ${t.dept}</div></div>
        <div>${statusTag(t.status)}</div>
      </div>
      <div class="card" style="padding:14px 16px">${stepsHtml(t.steps,t.step,t.status)}</div>
      ${t.ai&&t.ai.length?`<div class="card" style="padding:14px 16px"><h3 style="margin-top:0">🤖 AI 辅助提示</h3>${t.ai.map((a,idx)=>`<div class="ai-item"><span class="lv ${idx===0?"high":"mid"}">${idx===0?"高":"中"}</span><span>${a}</span></div>`).join("")}</div>`:""}
      <div class="card" style="padding:14px 16px"><h3 style="margin-top:0">🧾 说明</h3><div>${t.note||"无"}</div></div>
      <div class="card" style="padding:14px 16px"><h3 style="margin-top:0">🕒 流转记录</h3><div class="timeline">${(t.history&&t.history.length?t.history.slice().reverse().map(h=>`<div class="tl-item"><div class="tl-head">${h.a}</div><div class="tl-meta">${h.w} · ${h.t}</div></div>`).join(""):`<div class="tl-item"><div class="tl-head">提交申请</div><div class="tl-meta">${t.submit} · ${t.time}</div></div>`)}</div></div>`;
    let foot="";
    if(t.status==="审批中")foot=`<button class="btn primary" onclick="approve('${t.id}',true)">通过</button> <button class="btn" onclick="approve('${t.id}',false)">驳回</button>`;
    else foot=`<button class="btn" onclick="closeDetail()">关闭</button>`;
    document.getElementById("detailFoot").innerHTML=foot;
    detailMask.classList.add("show"); return;
  }
  // 匹配流程
  const f=OA_FLOWS.find(x=>x.id===id);
  if(f){
    const steps=["发起申请","部门审核","会签/复核","审批归档"];
    document.getElementById("detailTitle").textContent=f.name;
    document.getElementById("detailBody").innerHTML=`
      <div style="font-weight:600;margin-bottom:10px">${f.id} · ${f.cat}</div>
      <div class="card" style="padding:14px 16px">${stepsHtml(steps,1,"审批中")}</div>
      <div class="card" style="padding:14px 16px"><h3 style="margin-top:0">📝 功能描述</h3><div>${f.desc}</div></div>
      <div class="card" style="padding:14px 16px"><h3 style="margin-top:0">👤 关键角色</h3><div>${f.owner}</div></div>`;
    document.getElementById("detailFoot").innerHTML=`<button class="btn" onclick="closeDetail()">关闭</button>`;
    detailMask.classList.add("show"); return;
  }
  // 匹配风险
  openRiskDetail(id);
}
function openRiskDetail(id){
  const r=riskPool.find(x=>x.id===id); if(!r)return;
  document.getElementById("detailTitle").textContent="风险记录 · "+r.id;
  document.getElementById("detailBody").innerHTML=`
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <div><div style="font-weight:700;font-size:16px">${r.scene}</div><div style="color:var(--muted);font-size:12px;margin-top:4px">${r.unit} | ${r.occur} | ${r.src}</div></div>
      <div>${lvTag(r.lv)} ${statusTag(r.status)}</div>
    </div>
    <div class="card" style="padding:14px 16px"><h3 style="margin-top:0">📝 风险明细</h3><div>${r.detail}</div></div>
    <div class="card" style="padding:14px 16px"><h3 style="margin-top:0">🤖 识别依据</h3><div>${r.ev}</div></div>`;
  let foot=`<button class="btn" onclick="closeDetail()">关闭</button>`;
  if(r.status==="待审核")foot=`<button class="btn primary" onclick="auditRisk('${r.id}',true)">核实并进入整改</button> <button class="btn" onclick="auditRisk('${r.id}',false)">驳回(误报)</button>`;
  document.getElementById("detailFoot").innerHTML=foot;
  detailMask.classList.add("show");
}
function closeDetail(){detailMask.classList.remove("show");}
document.addEventListener("click",e=>{if(e.target.classList.contains("mask"))e.target.classList.remove("show");});
