<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>五粮液精美印务 · OA与观星台</title>
<meta name="description" content="泛微 E10 低代码平台 · 五粮液精美印务 AI+印刷包装智能制造 OA系统与观星台演示。按工作台、人力资源部、党政综合办、审计监督部、信息工程部、经营发展部、观星台七大规模组织，含各部门流程清单、可交互表单与审批、业务台账、经营驾驶舱、AI风险监测等。纯静态单文件，可直接部署 GitHub Pages。" />
<style>
  :root{
    --primary:#1f5fd6; --primary-dark:#174bb0; --primary-light:#e7f0ff;
    --orange:#f59d2f; --green:#18a879; --red:#e5533c; --purple:#8a5bd6; --cyan:#1fa2c4;
    --indigo:#4f46e5; --teal:#0ea5a9;
    --bg:#f2f4fa; --panel:#fff; --line:#e6e9f0; --text:#26324b; --muted:#8a93a6;
    --shadow:0 2px 6px rgba(30,50,90,.08); --shadow-lg:0 12px 32px rgba(30,50,90,.16);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  .app{display:flex;height:100vh;overflow:hidden;}

  /* ---------- 左侧菜单 ---------- */
  .sidenav{width:248px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line);}
  .brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#1f5fd6,#7b3ff2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 10px rgba(31,95,214,.4);}
  .brand .t1{font-weight:700;font-size:14px;line-height:1.2;}
  .brand .t2{font-size:11px;color:var(--muted);}
  .menu{padding:8px 12px;overflow-y:auto;flex:1;}
  .menu .grp{font-size:11px;color:var(--muted);padding:14px 8px 6px;letter-spacing:.5px;display:flex;align-items:center;gap:6px;}
  .menu .grp .dotapp{width:8px;height:8px;border-radius:3px;display:inline-block;}
  .menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer;margin-bottom:2px;transition:.15s;}
  .menu a .ico{width:20px;text-align:center;opacity:.85;font-size:16px;}
  .menu a:hover{background:#f4f6fb;}
  .menu a.active{background:var(--primary-light);color:var(--primary);font-weight:600;}
  .menu a.active .ico{opacity:1;}
  .menu a .badge{background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:1px 6px;margin-left:auto;font-weight:400;}

  /* ---------- 主区域 ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0;}
  .topbar .crumb{color:var(--muted);display:flex;align-items:center;gap:6px;font-size:13px;}
  .topbar .crumb b{color:var(--text);font-weight:600;}
  .topbar .spacer{flex:1;}
  .topbar .user{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .content{flex:1;overflow:auto;padding:22px;}

  /* ---------- 通用组件 ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
  .card + .card{margin-top:18px;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .grid-cards.c3{grid-template-columns:repeat(3,1fr);}
  .grid-cards.c5{grid-template-columns:repeat(5,1fr);}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .stat .lbl{color:var(--muted);font-size:13px;}
  .stat .num{font-size:28px;font-weight:700;margin:6px 0 4px;}
  .stat .sub{font-size:12px;color:var(--muted);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  .btn:hover{border-color:var(--primary);color:var(--primary);}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.sm{padding:5px 12px;font-size:12px;border-radius:6px;}

  table.grid{width:100%;border-collapse:collapse;}
  table.grid th{background:#f7f9fd;text-align:left;padding:10px 12px;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;}
  table.grid td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;}
  table.grid tbody tr{cursor:pointer;transition:.12s;}
  table.grid tbody tr:hover{background:#f5f8ff;}
  .tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;line-height:18px;}
  .tag.green{background:#e5f8f0;color:#0d9160;}
  .tag.orange{background:#fef1e0;color:#c47b10;}
  .tag.red{background:#fde8e5;color:#c03420;}
  .tag.gray{background:#eef1f6;color:#6b7488;}
  .tag.purple{background:#efe8fb;color:#6d43c0;}
  .tag.blue{background:var(--primary-light);color:var(--primary);}
  .tag.cyan{background:#e2f5fa;color:#137a95;}
  .tag.indigo{background:#e8e9fc;color:#4f46e5;}
  .money{font-weight:600;}

  /* ---------- 步骤条 ---------- */
  .steps{display:flex;align-items:flex-start;padding:6px 0;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;min-width:0;}
  .step::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:#e6e9f0;z-index:0;}
  .step:first-child::before{display:none;}
  .step .circ{width:30px;height:30px;border-radius:50%;background:#e6e9f0;color:#98a1b5;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;z-index:1;border:2px solid #fff;}
  .step.on .circ{background:var(--primary);color:#fff;box-shadow:0 0 0 5px rgba(31,95,214,.15);}
  .step.done .circ{background:var(--green);color:#fff;}
  .step.done::before{background:var(--green);}
  .step.on::before{background:var(--primary);}
  .step .name{font-size:12px;margin-top:8px;color:var(--muted);}
  .step.on .name{color:var(--text);font-weight:600;}
  .step .who{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ---------- 时间线 ---------- */
  .timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:18px;}
  .tl-item{position:relative;padding-bottom:16px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:"";position:absolute;left:-24px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-light);}
  .tl-item .tl-head{font-size:13px;font-weight:600;}
  .tl-item .tl-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .tl-item .tl-note{font-size:12px;color:var(--text);margin-top:4px;background:var(--primary-light);padding:6px 10px;border-radius:6px;}

  /* ---------- 图表 ---------- */
  .bars{display:flex;align-items:flex-end;gap:18px;height:220px;padding:10px 6px 0;}
  .bars .bb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bars .bb .val{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .bars .bb i{display:block;width:40px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#4d84ef,#1f5fd6);margin-bottom:0;}
  .bars .bb .bx{font-size:12px;color:var(--text);margin-top:8px;text-align:center;}
  .gauge-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;}
  .kpi{text-align:center;padding:14px;border-top:3px solid var(--line);border-radius:8px;}
  .kpi .n{font-size:22px;font-weight:700;}

  /* ---------- 子模块 Tab ---------- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:10px;}
  .tabs a{padding:7px 14px;border-radius:7px;color:var(--text);font-size:13px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;}
  .tabs a:hover{background:#f4f6fb;}
  .tabs a.active{background:var(--primary);color:#fff;font-weight:600;}

  /* ---------- 模态 ---------- */
  .mask{position:fixed;inset:0;background:rgba(20,30,55,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:12px;width:640px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg);}
  .modal.wide{width:900px;}
  .modal .m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2;}
  .modal .m-head h4{margin:0;font-size:16px;}
  .modal .m-body{padding:20px 22px;}
  .modal .m-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff;}
  .x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;}
  .x:hover{color:var(--text);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12px;color:var(--muted);}
  .field label b{color:var(--red);}
  .field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,95,214,.12);}
  .field textarea{resize:vertical;min-height:70px;}

  .ai-box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fbfcff;}
  .ai-box .ai-h{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .ai-item{display:flex;gap:8px;padding:7px 10px;border-radius:6px;margin-bottom:6px;font-size:12px;background:#fff;border:1px solid var(--line);}
  .ai-item .lv{width:60px;text-align:center;border-radius:6px;font-weight:600;flex-shrink:0;align-self:center;}
  .ai-item .lv.high{background:#fde8e5;color:#c03420;}
  .ai-item .lv.mid{background:#fef1e0;color:#c47b10;}
  .ai-item .lv.low{background:#efe8fb;color:#6d43c0;}

  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#26324b;color:#fff;padding:12px 22px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;z-index:99;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .empty{padding:40px;text-align:center;color:var(--muted);}

  .dept-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:16px;background:#f4f6fb;color:var(--text);font-size:12px;margin-right:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:.15s;}
  .dept-chip:hover{border-color:var(--primary);color:var(--primary);}
  .dept-chip.active{background:var(--primary);color:#fff;}
  .legend-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:14px;}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;}
  table.mini td{padding:6px 6px;border-bottom:1px solid var(--line);}
  table.mini td:first-child{color:var(--muted);}
  .head-banner{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .head-banner .hb-ic{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;}
  .head-banner .hb-t1{font-size:20px;font-weight:700;}
  .head-banner .hb-t2{font-size:13px;color:var(--muted);margin-top:4px;}
  .flow-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:1000px){.grid-cards,.grid-cards.c5{grid-template-columns:repeat(2,1fr);}.gauge-wrap{grid-template-columns:repeat(2,1fr);}.flow-list{grid-template-columns:1fr;}.sidenav{width:214px;}}
  @media(max-width:720px){.sidenav{display:none;}.split{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app">
  <nav class="sidenav">
    <div class="brand">
      <div class="logo">五</div>
      <div><div class="t1">五粮液精美印务</div><div class="t2">OA / 观星台 · 演示</div></div>
    </div>
    <div class="menu" id="menu"></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="crumb">泛微 E10 · 项目 OA 系统 <span>›</span> <b id="crumb">工作台</b></div>
      <div class="spacer"></div>
      <span class="btn sm" id="quickNew">＋ 新建</span>
      <div class="user"><div class="avatar">王</div> 王小明</div>

    <div class="content" id="content"></div>
  </div>
</div>

<div class="mask" id="detailMask"><div class="modal wide"><div class="m-head"><h4 id="detailTitle">详情</h4><button class="x" onclick="closeDetail()">✕</button></div><div class="m-body" id="detailBody"></div><div class="m-foot" id="detailFoot"></div></div></div>
<div class="mask" id="formMask"><div class="modal wide"><div class="m-head"><h4 id="formTitle">新建</h4><button class="x" onclick="closeForm()">✕</button></div><div class="m-body" id="formBody"></div><div class="m-foot"><button class="btn" onclick="closeForm()">取消</button><button class="btn primary" onclick="submitForm()">保存并提交</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
  五粮液精美印务 · AI+印刷包装智能制造 · OA 与 观星台 演示
  依据 《-OA-SOWv1.7》(2026-08-24) 七大规模组织
  ============================================================ */
function now(){const d=new Date();const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
const money=n=>Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:0});

/* ================== 七大规模：部门配置 ================== */
// module: 菜单 key；routes: 该部门下的子模块 tab
const DEPTS=[
  {id:"hr",name:"人力资源部",color:"#2b6de8",ico:"🧑‍💼",desc:"负责假勤考勤、员工入转调离、员工档案、劳动合同、薪酬工资条、培训证照及岗位资格等业务规则确认。OA承接流程协同与档案沉淀；薪资计算、计件工资、绩效与发放由ERP承接。",
    kpi:[["在职员工",512,"较上月 +6"],["本月入职",18,"审批中 3"],["本月离职",9,"待办 2"],["假勤在办",126,"请假 58 / 加班 41"]],
    routes:[["life","员工全生命周期"],["kq","假勤考勤"],["salary","薪酬与福利"],["train","培训证照与资格"],["archive","员工档案与合同"]]},
  {id:"party",name:"党政综合办",color:"#e5533c",ico:"🏛️",desc:"负责党政公文、用印证照、会议会务、督办事项、任务、费用标准审核及行政资料归集等业务规则确认；集团OA衔接及涉密事项按集团制度执行。",
    kpi:[["今日收文",14,"待办 5"],["用印申请",8,"本周 32 份"],["会议预定",6,"冲突校验 0"],["督办在办",52,"临期 7"]],
    routes:[["doc","党政公文"],["seal","用印证照"],["meet","会议会务"],["supervise","督办与任务"],["archive","档案管理"],["party2","党建/工会/董事会"]]},
  {id:"audit",name:"审计监督部",color:"#8a5bd6",ico:"🛡️",desc:"负责合同合规、AI合同辅助审核、双源风险管理、审计整改管理及招采监督协同。OA承接评审、监督、台账与整改销账；合同付款及招采专业主流程由ERP/SRM闭环。",
    kpi:[["在审合同",6,"AI提示 18 条"],["风险台账",37,"高 3"],["审计整改",14,"超期 3"],["招采监督",4,"整改 2"]],
    routes:[["contract","合同管理与AI审核"],["risk","双源风险管理"],["auditfix","审计整改销账"],["procure","招采监督"],["legal","合规与法律"]]},
  {id:"info",name:"信息工程部",color:"#0ea5a9",ico:"💻",desc:"负责应用系统账号开通/变更/注销、权限申请与回收、流程代理、OA流程及审批矩阵变更、应用接入、接口申请、数据报表授权、系统报修、发布变更及主数据维护等。",
    kpi:[["账号申请",23,"在办 6"],["接口在办",4,"联调 2"],["故障报修",11,"高优 2"],["发布变更",3,"待验证 1"]],
    routes:[["account","账号与权限"],["proxy","授权与代理"],["iface","系统接入与接口"],["data","数据权限"],["ops","运维与发布"],["md","主数据管理"]]},
  {id:"biz",name:"经营发展部",color:"#1fa2c4",ico:"📣",desc:"对外宣传材料发布前进行内部审核；同时作为观星台的业务牵头部门，提出经营指标与简报场景、确认指标口径、图表、目标与异常原因模板。",
    kpi:[["宣传待审",5,"本月发布 28"],["指标提出",16,"待确认 3"],["简报期次",1,"2026-06期"],["专题分析",4,"经营总览"]],
    routes:[["publicity","宣传发布审批"],["star_tie","观星台需求对接"]]},
  {id:"star",name:"观星台",color:"#7b3ff2",ico:"🚀",desc:"面向公司、业务域/车间及产线/精益单元的跨系统数据运营与经营分析平台。以指标体系为主线，建设驾驶舱、指挥看板、会议场景、问题闭环、数据治理和AI风险识别。",
    kpi:[["接入主题",12,"6 大主题域"],["有效指标",86,"本期落 40"],["驾驶舱指标",8,"公司层"],["风险待审",4,"AI 3 / 人工 1"]],
    routes:[["cockpit","公司驾驶舱"],["board","指挥看板"],["brief","经营简报"],["meeting","会议分析"],["ind","指标目录"],["issue","问题闭环"],["data","数据治理"],["risk","AI风险监测"],["energy","能源分析"]]},
];

/* ------------------ 流程清单（SOW 各部门流程节选） ------------------ */
// 每个流程：id(编号), cat(部门), sub(子模块key), name, desc, steps[], controls, owner
const FLOWS=[

function stepsHtml(steps,cur,status){
  return `<div class="steps">${steps.map((s,i)=>{
    let cls="";
    if(status==="已归档")cls="done";
    else if(status==="已驳回"){if(i<cur)cls="done";else if(i===cur)cls="on";}
    else if(status==="审批中"){if(i<cur)cls="done";else if(i===cur)cls="on";}
    else if(status==="草稿"){if(i===0)cls="on";}
    return `<div class="step ${cls}"><div class="circ">${i+1}</div><div class="name">${s}</div>${i===cur&&status==="审批中"?`<div class="who">当前</div>`:""}</div>`;
  }).join("")}</div>`;
}

function subViewTab(s){curDeptSub=s;render();}
function approve(id,ok){
  const t=todos.find(x=>x.id===id); if(!t)return;
  const tn=now();
  if(ok){
    t.history=t.history||[];t.history.push({t:tn,w:nameOf(t.dept)+"·王小明",a:`${t.steps[Math.min(t.step,t.steps.length-1)]} · 同意`});
    t.step++;
    if(t.step>=t.steps.length){t.step=t.steps.length-1;t.status="已归档";toast("已通过，流程归档");}
    else {t.status="审批中";toast("已同意，进入「"+t.steps[t.step]+"」");}
  } else {
    t.status="已驳回";toast("已驳回该事项");
  }
  render();openDetail(id);
}
function auditRisk(id,ok){
  const r=riskPool.find(x=>x.id===id); if(!r)return;
  if(ok){r.status="整改中";toast("已核实，进入 OA 风险整改闭环");}else{r.status="已销号";toast("已驳回，记为误报");}
  render();openRiskDetail(id);
}
const ISSUE_FLOW=["待上报","待核实","已分派","整改中","待复核","已关闭"];
function advanceIssue(id){
  const i=issues.find(x=>x.id===id); if(!i)return;
  const cur=ISSUE_FLOW.indexOf(i.status);
  i.status=ISSUE_FLOW[Math.min(cur+1,ISSUE_FLOW.length-1)];
  i.progress=(i.status==="已关闭")?"已完成 100%":i.status==="整改中"?"已完成 60%":i.progress;
  toast("问题状态 → "+i.status);render();
}

  const name=document.getElementById("c_name").value.trim()||"合同";
  if(!amt){toast("请填写合同金额");return;}
  const id="TD-"+(50+todos.length+1);
  const t={id,flow:"合同评审及审批",title:`${name} · 金额 ${amt} 万`,dept:"audit",owner:"曹怀月",submit:"采购部·李强",time:now(),step:1,steps:["分类评审","AI风险提示","人工审核","审批","关联用印","导出归档"],status:"审批中",note:"新发起的合同评审，等待业务会签。",ai:["AI 将结合历史价、付款与履约条款输出风险提示","建议复核预付款比例与履约保证"]};
  todos.push(t);
  closeForm();toast("已提交，进入「分类评审」节点");render();openDetail(id);
}
